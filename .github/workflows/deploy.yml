name: 构建并发布站点

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Pages 发布所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个发布任务，避免并发写入 Pages
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.169.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Hugo extended
        run: |
          wget -q -O hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: 校验站点文章与总文档同步
        run: python3 scripts/build_content.py --check

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 构建
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
